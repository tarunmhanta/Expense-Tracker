<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spendly</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap"
    rel="stylesheet">
  <style>
    /* ── Reset & Tokens ─────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0d13;
      --surface: #141820;
      --surface2: #1b2030;
      --border: #252d3d;
      --credit: #00e5a0;
      --credit-glow: rgba(0, 229, 160, .18);
      --credit-dim: rgba(0, 229, 160, .08);
      --debit: #ff6060;
      --debit-glow: rgba(255, 96, 96, .18);
      --debit-dim: rgba(255, 96, 96, .08);
      --accent: #7c6cfc;
      --accent-dim: rgba(124, 108, 252, .12);
      --gold: #ffd166;
      --text: #e6e9f2;
      --muted: #6b7a96;
      --faint: #2e3a50;
      --r: 18px;
      --r-sm: 12px;
      --r-xs: 8px;
    }

    html,
    body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(600px circle at 10% 0%, rgba(124, 108, 252, .08) 0%, transparent 60%),
        radial-gradient(500px circle at 90% 100%, rgba(0, 229, 160, .07) 0%, transparent 60%);
    }

    #app {
      position: relative;
      z-index: 1;
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 20px 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 8px;
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 24px;
      background: linear-gradient(120deg, var(--accent), var(--credit));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -.5px;
    }

    .gear-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 17px;
      color: var(--muted);
      transition: border-color .2s, color .2s, transform .3s;
      flex-shrink: 0;
    }

    .gear-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: rotate(45deg);
    }

    .view {
      animation: rise .35s cubic-bezier(.25, .8, .25, 1) both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ══ WELCOME ══ */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 0 40px;
    }

    .welcome-icon {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      margin: 0 auto 28px;
      background: linear-gradient(135deg, var(--accent-dim), rgba(0, 229, 160, .1));
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-8px)
      }
    }

    .welcome h1 {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff 30%, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      max-width: 280px;
      margin: 0 auto 32px;
    }

    .feat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-bottom: 32px;
    }

    .feat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 16px 14px;
      text-align: left;
      animation: rise .4s ease both;
    }

    .feat-card:nth-child(2) {
      animation-delay: .06s
    }

    .feat-card:nth-child(3) {
      animation-delay: .12s
    }

    .feat-card:nth-child(4) {
      animation-delay: .18s
    }

    .feat-card .fi {
      font-size: 22px;
      margin-bottom: 8px;
      display: block;
    }

    .feat-card strong {
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 700;
      display: block;
      margin-bottom: 3px;
    }

    .feat-card span {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: var(--r);
      background: linear-gradient(135deg, var(--accent), #5b8dee);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      cursor: pointer;
      letter-spacing: .2px;
      box-shadow: 0 6px 24px rgba(124, 108, 252, .35);
      transition: transform .2s, box-shadow .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(124, 108, 252, .45);
    }

    .btn-primary:active {
      transform: translateY(0) scale(.98);
    }

    /* ══ ADD SCREEN ══ */
    .add-screen {
      flex: 1;
      padding-top: 8px;
    }

    .month-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 10px 16px;
      margin-bottom: 20px;
    }

    .month-pill .month-label {
      font-size: 13px;
      color: var(--muted);
    }

    .month-pill .month-bal {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
    }

    .month-pill .month-bal.pos {
      color: var(--credit);
    }

    .month-pill .month-bal.neg {
      color: var(--debit);
    }

    .month-pill .month-bal.neu {
      color: var(--text);
    }

    .pill-stats {
      display: flex;
      gap: 12px;
    }

    .pill-stat {
      font-size: 11px;
    }

    .pill-stat .ps-lbl {
      color: var(--muted);
      margin-right: 3px;
    }

    .pill-stat .ps-val {
      font-weight: 600;
    }

    .ps-val.c {
      color: var(--credit);
    }

    .ps-val.d {
      color: var(--debit);
    }

    .type-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .type-btn {
      flex: 1;
      padding: 14px 10px;
      border-radius: var(--r);
      border: 2px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: var(--muted);
      transition: all .22s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .type-btn.c-active {
      border-color: var(--credit);
      background: var(--credit-dim);
      color: var(--credit);
      box-shadow: 0 0 18px var(--credit-glow);
    }

    .type-btn.d-active {
      border-color: var(--debit);
      background: var(--debit-dim);
      color: var(--debit);
      box-shadow: 0 0 18px var(--debit-glow);
    }

    .type-btn:hover:not(.c-active):not(.d-active) {
      border-color: var(--faint);
      color: var(--text);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .9px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .amt-wrap {
      position: relative;
    }

    .amt-prefix {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--muted);
      pointer-events: none;
      line-height: 1;
    }

    input[type=number],
    textarea {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      padding: 14px 16px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type=number] {
      padding-left: 44px;
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 700;
      height: 66px;
    }

    input[type=number]:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    textarea {
      resize: none;
      height: 88px;
      font-size: 15px;
      line-height: 1.5;
    }

    ::placeholder {
      color: var(--faint);
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
    }

    .submit-btn {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: var(--r);
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all .22s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      letter-spacing: .2px;
      margin-top: 4px;
    }

    .submit-btn.credit {
      background: linear-gradient(135deg, var(--credit), #00b87a);
      color: #0a1a10;
      box-shadow: 0 6px 22px var(--credit-glow);
    }

    .submit-btn.debit {
      background: linear-gradient(135deg, var(--debit), #d63c3c);
      color: #fff;
      box-shadow: 0 6px 22px var(--debit-glow);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .submit-btn:active {
      transform: translateY(0) scale(.98);
    }

    .submit-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
      filter: none;
      box-shadow: none;
    }

    /* ── Recent wrap ── */
    .recent-wrap {
      margin-top: 28px;
    }

    .recent-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .recent-hdr h3 {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
    }

    .txn-count {
      font-size: 11px;
      background: var(--accent-dim);
      color: var(--accent);
      border-radius: 20px;
      padding: 3px 9px;
      font-weight: 600;
    }

    /* ── Search bar ── */
    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .search-row input[type=text] {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 11px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      -webkit-appearance: none;
      appearance: none;
    }

    .search-row input[type=text]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .search-row input[type=text]::placeholder {
      color: var(--faint);
    }

    .search-btn {
      padding: 0 16px;
      border: none;
      border-radius: var(--r-sm);
      background: var(--accent);
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s, transform .15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-btn:hover {
      background: #6a5ce6;
    }

    .search-btn:active {
      transform: scale(.97);
    }

    .search-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .search-clear-btn {
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--surface);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: color .2s, border-color .2s;
      white-space: nowrap;
    }

    .search-clear-btn:hover {
      color: var(--text);
      border-color: var(--faint);
    }

    .search-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-meta strong {
      color: var(--accent);
    }

    .txn-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .txn-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      animation: rise .3s ease both;
    }

    .txn-dot {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .txn-dot.credit {
      background: var(--credit-dim);
    }

    .txn-dot.debit {
      background: var(--debit-dim);
    }

    .txn-body {
      flex: 1;
      min-width: 0;
    }

    .txn-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .txn-time {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .txn-val {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .txn-val.credit {
      color: var(--credit);
    }

    .txn-val.debit {
      color: var(--debit);
    }

    .empty-note {
      text-align: center;
      padding: 24px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .loading-note {
      text-align: center;
      padding: 20px 0;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* ══ SETTINGS ══ */
    .settings-screen {
      flex: 1;
      padding-top: 6px;
      padding-bottom: 20px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      padding: 0;
      margin-bottom: 20px;
      transition: color .2s;
    }

    .back-btn:hover {
      color: var(--text);
    }

    .back-btn svg {
      width: 14px;
      height: 14px;
    }

    .s-section {
      margin-bottom: 24px;
    }

    .s-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      display: block;
    }

    .s-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px;
    }

    .s-card+.s-card {
      margin-top: 10px;
    }

    .s-card p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 12px;
    }

    .s-card p:last-child {
      margin-bottom: 0;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-badge.on {
      background: var(--credit-dim);
      color: var(--credit);
      border: 1px solid rgba(0, 229, 160, .25);
    }

    .status-badge.off {
      background: var(--debit-dim);
      color: var(--debit);
      border: 1px solid rgba(255, 96, 96, .25);
    }

    .status-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .steps {
      list-style: none;
      counter-reset: s;
    }

    .steps li {
      counter-increment: s;
      display: flex;
      gap: 11px;
      margin-bottom: 11px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
    }

    .steps li::before {
      content: counter(s);
      min-width: 21px;
      height: 21px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1px solid rgba(124, 108, 252, .35);
      color: var(--accent);
      font-family: 'Syne', sans-serif;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .steps li strong {
      color: var(--text);
    }

    .steps li em {
      color: var(--gold);
      font-style: normal;
    }

    .code-box {
      background: #080a0f;
      border: 1px solid var(--faint);
      border-radius: var(--r-xs);
      padding: 14px;
      font-family: 'Courier New', monospace;
      font-size: 10.5px;
      color: #8ecf8e;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 190px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .code-box::-webkit-scrollbar {
      width: 3px;
    }

    .code-box::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .copy-btn {
      width: 100%;
      padding: 10px;
      border-radius: var(--r-xs);
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all .2s;
    }

    .copy-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .copy-btn.copied {
      border-color: var(--credit);
      color: var(--credit);
    }

    .url-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .url-row input[type=url] {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-xs);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 11px 13px;
      outline: none;
      transition: border-color .2s;
      -webkit-appearance: none;
      appearance: none;
    }

    .url-row input[type=url]:focus {
      border-color: var(--accent);
    }

    .url-row input[type=url]::placeholder {
      color: var(--faint);
    }

    .save-btn {
      padding: 0 16px;
      border: none;
      border-radius: var(--r-xs);
      background: var(--accent);
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s;
    }

    .save-btn:hover {
      background: #6a5ce6;
    }

    .remove-btn {
      width: 100%;
      padding: 10px;
      border-radius: var(--r-xs);
      border: 1px solid rgba(255, 96, 96, .3);
      background: var(--debit-dim);
      color: var(--debit);
      font-size: 13px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all .2s;
    }

    .remove-btn:hover {
      border-color: var(--debit);
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      opacity: 0;
      transition: opacity .28s, transform .28s;
      z-index: 999;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.ok {
      border-color: var(--credit);
      color: var(--credit);
    }

    #toast.err {
      border-color: var(--debit);
      color: var(--debit);
    }

    .spin {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, .25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: rot .55s linear infinite;
      display: inline-block;
    }

    @keyframes rot {
      to {
        transform: rotate(360deg);
      }
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="topbar">
      <div class="logo">spendly</div>
      <button class="gear-btn" id="gear" onclick="goSettings()" title="Settings">⚙</button>
    </div>
    <div id="view"></div>
  </div>
  <div id="toast"></div>

  <script>
    /* ════════════════════════════════════════════
       GAS CODE
    ════════════════════════════════════════════ */
    var GAS = [
      "// Spendly – Google Apps Script",
      "// SETUP: Extensions > Apps Script > paste this > Save",
      "// Deploy > New Deployment > Web App",
      "//   Execute as: Me  |  Who has access: Anyone",
      "// Copy the Web App URL and paste it in Spendly Settings.",
      "",
      "function doPost(e) {",
      "  try {",
      "    var d = JSON.parse(e.postData.contents);",
      "    var ss = SpreadsheetApp.getActiveSpreadsheet();",
      "    var ts = ss.getSheetByName('Transactions');",
      "    if (!ts) {",
      "      ts = ss.insertSheet('Transactions');",
      "      ts.appendRow(['Date','Time','Type','Amount','Reason','Month','Year','Week']);",
      "      ts.getRange(1,1,1,8).setFontWeight('bold')",
      "        .setBackground('#1a1f30').setFontColor('#ffffff');",
      "    }",
      "    var dt = new Date(d.date);",
      "    ts.appendRow([d.dateStr, d.timeStr, d.type,",
      "      parseFloat(d.amount), d.reason,",
      "      dt.getMonth()+1, dt.getFullYear(), weekNum(dt)]);",
      "    ensureMonthly(ss, dt);",
      "    ensureYearly(ss, dt);",
      "    return ContentService",
      "      .createTextOutput(JSON.stringify({ok:true}))",
      "      .setMimeType(ContentService.MimeType.JSON);",
      "  } catch(err) {",
      "    return ContentService",
      "      .createTextOutput(JSON.stringify({ok:false,e:err.toString()}))",
      "      .setMimeType(ContentService.MimeType.JSON);",
      "  }",
      "}",
      "",
      "function doGet(e) {",
      "  try {",
      "    var action = e.parameter.action || '';",
      "",
      "    // ── Summary (month totals) ──────────────────",
      "    if (action === 'summary') {",
      "      var ss = SpreadsheetApp.getActiveSpreadsheet();",
      "      var sheet = ss.getSheetByName('Transactions');",
      "      if (!sheet) {",
      "        return ContentService",
      "          .createTextOutput(JSON.stringify({success:true,credit:0,debit:0,balance:0}))",
      "          .setMimeType(ContentService.MimeType.JSON);",
      "      }",
      "      var data = sheet.getDataRange().getValues();",
      "      var now = new Date();",
      "      var currentMonth = now.getMonth() + 1;",
      "      var currentYear  = now.getFullYear();",
      "      var credit = 0, debit = 0;",
      "      for (var i = 1; i < data.length; i++) {",
      "        if (Number(data[i][5]) === currentMonth && Number(data[i][6]) === currentYear) {",
      "          var type = String(data[i][2]).toLowerCase();",
      "          var amt  = Number(data[i][3]) || 0;",
      "          if (type === 'credit') credit += amt;",
      "          if (type === 'debit')  debit  += amt;",
      "        }",
      "      }",
      "      return ContentService",
      "        .createTextOutput(JSON.stringify({success:true,credit:credit,debit:debit,balance:credit-debit}))",
      "        .setMimeType(ContentService.MimeType.JSON);",
      "    }",
      "",
      "    // ── Recent 5 transactions ───────────────────",
      "    if (action === 'recent') {",
      "      var ss = SpreadsheetApp.getActiveSpreadsheet();",
      "      var sheet = ss.getSheetByName('Transactions');",
      "      if (!sheet || sheet.getLastRow() < 2) {",
      "        return ContentService",
      "          .createTextOutput(JSON.stringify({success:true,transactions:[]}))",
      "          .setMimeType(ContentService.MimeType.JSON);",
      "      }",
      "      var lastRow = sheet.getLastRow();",
      "      // grab last 5 data rows (skip header row 1)",
      "      var startRow = Math.max(2, lastRow - 4);",
      "      var numRows  = lastRow - startRow + 1;",
      "      var rows = sheet.getRange(startRow, 1, numRows, 5).getValues();",
      "      var txns = [];",
      "      for (var i = rows.length - 1; i >= 0; i--) {",
      "        txns.push({",
      "          dateStr: rows[i][0],",
      "          timeStr: rows[i][1],",
      "          type:    rows[i][2],",
      "          amount:  rows[i][3],",
      "          reason:  rows[i][4]",
      "        });",
      "      }",
      "      return ContentService",
      "        .createTextOutput(JSON.stringify({success:true,transactions:txns}))",
      "        .setMimeType(ContentService.MimeType.JSON);",
      "    }",
      "",
      "    // ── Search all transactions ─────────────────",
      "    if (action === 'search') {",
      "      var q = (e.parameter.q || '').toLowerCase().trim();",
      "      var ss = SpreadsheetApp.getActiveSpreadsheet();",
      "      var sheet = ss.getSheetByName('Transactions');",
      "      if (!sheet || sheet.getLastRow() < 2) {",
      "        return ContentService",
      "          .createTextOutput(JSON.stringify({success:true,transactions:[],total:0}))",
      "          .setMimeType(ContentService.MimeType.JSON);",
      "      }",
      "      var data = sheet.getRange(2, 1, sheet.getLastRow()-1, 5).getValues();",
      "      var results = [];",
      "      for (var i = data.length - 1; i >= 0; i--) {",
      "        var reason = String(data[i][4]).toLowerCase();",
      "        var type   = String(data[i][2]).toLowerCase();",
      "        var date   = String(data[i][0]).toLowerCase();",
      "        if (!q || reason.indexOf(q) !== -1 || type.indexOf(q) !== -1 || date.indexOf(q) !== -1) {",
      "          results.push({",
      "            dateStr: data[i][0],",
      "            timeStr: data[i][1],",
      "            type:    data[i][2],",
      "            amount:  data[i][3],",
      "            reason:  data[i][4]",
      "          });",
      "        }",
      "      }",
      "      return ContentService",
      "        .createTextOutput(JSON.stringify({success:true,transactions:results,total:results.length}))",
      "        .setMimeType(ContentService.MimeType.JSON);",
      "    }",
      "",
      "    return ContentService.createTextOutput('Spendly API Running');",
      "",
      "  } catch(err) {",
      "    return ContentService",
      "      .createTextOutput(JSON.stringify({success:false,error:err.toString()}))",
      "      .setMimeType(ContentService.MimeType.JSON);",
      "  }",
      "}",
      "",
      "function ensureMonthly(ss, dt) {",
      "  var yr = dt.getFullYear();",
      "  var name = 'Monthly_'+yr;",
      "  if (ss.getSheetByName(name)) return;",
      "  var sh = ss.insertSheet(name);",
      "  var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];",
      "  sh.appendRow(['Month','Credit','Debit','Balance']);",
      "  sh.getRange(1,1,1,4).setFontWeight('bold')",
      "    .setBackground('#0d1a14').setFontColor('#00e5a0');",
      "  for (var m=0; m<12; m++) {",
      "    var r = m+2;",
      "    sh.appendRow([mo[m],0,0,0]);",
      "    sh.getRange(r,2).setFormula(",
      "      '=SUMPRODUCT((MONTH(Transactions!A$2:A)='+(m+1)+')*'",
      "      +'(YEAR(Transactions!A$2:A)='+yr+')*'",
      "      +'(Transactions!C$2:C=\"credit\")*Transactions!D$2:D)');",
      "    sh.getRange(r,3).setFormula(",
      "      '=SUMPRODUCT((MONTH(Transactions!A$2:A)='+(m+1)+')*'",
      "      +'(YEAR(Transactions!A$2:A)='+yr+')*'",
      "      +'(Transactions!C$2:C=\"debit\")*Transactions!D$2:D)');",
      "    sh.getRange(r,4).setFormula('=B'+r+'-C'+r);",
      "  }",
      "  var rules = [",
      "    SpreadsheetApp.newConditionalFormatRule()",
      "      .whenNumberGreaterThan(0).setFontColor('#00e5a0')",
      "      .setRanges([sh.getRange('D2:D13')]).build(),",
      "    SpreadsheetApp.newConditionalFormatRule()",
      "      .whenNumberLessThan(0).setFontColor('#ff6060')",
      "      .setRanges([sh.getRange('D2:D13')]).build()",
      "  ];",
      "  sh.setConditionalFormatRules(rules);",
      "  sh.insertChart(sh.newChart()",
      "    .setChartType(Charts.ChartType.BAR)",
      "    .addRange(sh.getRange('A1:C13'))",
      "    .setPosition(2,6,0,0)",
      "    .setOption('title','Monthly '+yr)",
      "    .setOption('colors',['#00e5a0','#ff6060'])",
      "    .setOption('width',520).setOption('height',320).build());",
      "}",
      "",
      "function ensureYearly(ss, dt) {",
      "  var yr = dt.getFullYear();",
      "  var sh = ss.getSheetByName('Yearly_Summary');",
      "  if (!sh) {",
      "    sh = ss.insertSheet('Yearly_Summary');",
      "    sh.appendRow(['Year','Credit','Debit','Balance']);",
      "    sh.getRange(1,1,1,4).setFontWeight('bold')",
      "      .setBackground('#1a0d2e').setFontColor('#7c6cfc');",
      "  }",
      "  var rows = sh.getDataRange().getValues();",
      "  for (var i=0;i<rows.length;i++) { if (rows[i][0]==yr) return; }",
      "  var r = sh.getLastRow()+1;",
      "  sh.appendRow([yr,0,0,0]);",
      "  sh.getRange(r,2).setFormula(",
      "    '=SUMPRODUCT((YEAR(Transactions!A$2:A)='+yr+')*'",
      "    +'(Transactions!C$2:C=\"credit\")*Transactions!D$2:D)');",
      "  sh.getRange(r,3).setFormula(",
      "    '=SUMPRODUCT((YEAR(Transactions!A$2:A)='+yr+')*'",
      "    +'(Transactions!C$2:C=\"debit\")*Transactions!D$2:D)');",
      "  sh.getRange(r,4).setFormula('=B'+r+'-C'+r);",
      "  sh.getCharts().forEach(function(c){ sh.removeChart(c); });",
      "  sh.insertChart(sh.newChart()",
      "    .setChartType(Charts.ChartType.COLUMN)",
      "    .addRange(sh.getRange('A1:C'+sh.getLastRow()))",
      "    .setPosition(2,6,0,0)",
      "    .setOption('title','Yearly Summary')",
      "    .setOption('colors',['#00e5a0','#ff6060'])",
      "    .setOption('width',520).setOption('height',320).build());",
      "}",
      "",
      "function weekNum(d) {",
      "  var j = new Date(d.getFullYear(),0,1);",
      "  return Math.ceil((((d-j)/86400000)+j.getDay()+1)/7);",
      "}"
    ].join('\n');

    /* ════════════════════════════════════════════
       STATE
    ════════════════════════════════════════════ */
    var S = {
      url: localStorage.getItem('sp_url') || '',
      txns: JSON.parse(localStorage.getItem('sp_txns') || '[]'),
      type: 'debit',
      searchMode: false,
      searchQ: ''
    };

    /* ════════════════════════════════════════════
       BOOT
    ════════════════════════════════════════════ */
    function boot() {
      if (S.url) { showAdd(); } else { showWelcome(); }
    }

    /* ════════════════════════════════════════════
       WELCOME
    ════════════════════════════════════════════ */
    function showWelcome() {
      document.getElementById('gear').style.display = 'flex';
      setView(
        '<div class="view welcome">' +
        '<div class="welcome-icon">&#x1F4B8;</div>' +
        '<h1>Track Every Rupee,<br>Effortlessly</h1>' +
        '<p>Spendly syncs your expenses to Google Sheets — giving you instant monthly, weekly &amp; yearly reports.</p>' +
        '<div class="feat-grid">' +
        '<div class="feat-card"><span class="fi">&#x1F4CA;</span><strong>Live Sync</strong><span>Every entry goes to your Google Sheet</span></div>' +
        '<div class="feat-card"><span class="fi">&#x1F4C5;</span><strong>Reports</strong><span>Monthly, weekly &amp; yearly auto-charts</span></div>' +
        '<div class="feat-card"><span class="fi">&#x1F7E2;</span><strong>Credit &amp; Debit</strong><span>Income and expenses in one place</span></div>' +
        '<div class="feat-card"><span class="fi">&#x1F512;</span><strong>Your Data</strong><span>Stored in your own Google account</span></div>' +
        '</div>' +
        '<button class="btn-primary" onclick="goSettings()">&#x26A1; Connect Google Sheets</button>' +
        '</div>'
      );
    }

    /* ════════════════════════════════════════════
       ADD TRANSACTION
    ════════════════════════════════════════════ */
    function showAdd() {
      document.getElementById('gear').style.display = 'flex';

      var now = new Date();
      var m = now.getMonth();
      var y = now.getFullYear();
      var mo = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

      var cAct = S.type === 'credit' ? 'c-active' : '';
      var dAct = S.type === 'debit' ? 'd-active' : '';

      // Preserve search query value in the input if in search mode
      var searchVal = esc(S.searchQ);

      setView(
        '<div class="view add-screen">' +

        // Month pill
        '<div class="month-pill">' +
        '<span class="month-label">' + mo[m] + ' ' + y + '</span>' +
        '<div class="pill-stats">' +
        '<span class="pill-stat"><span class="ps-lbl">&#x2B06;</span><span class="ps-val c" id="credit-val">&#8377;…</span></span>' +
        '<span class="pill-stat"><span class="ps-lbl">&#x2B07;</span><span class="ps-val d" id="debit-val">&#8377;…</span></span>' +
        '</div>' +
        '<span class="month-bal neu" id="balance-val">&#8377;…</span>' +
        '</div>' +

        // Type toggle
        '<div class="type-row">' +
        '<button class="type-btn ' + cAct + '" onclick="setType(\'credit\')">&#x2B06; Credit</button>' +
        '<button class="type-btn ' + dAct + '" onclick="setType(\'debit\')">&#x2B07; Debit</button>' +
        '</div>' +

        // Amount
        '<div class="field">' +
        '<label>Amount (&#8377;)</label>' +
        '<div class="amt-wrap">' +
        '<span class="amt-prefix">&#8377;</span>' +
        '<input type="number" id="inp-amt" placeholder="0.00" min="0" step="0.01" inputmode="decimal">' +
        '</div>' +
        '</div>' +

        // Reason
        '<div class="field">' +
        '<label>Reason / Description</label>' +
        '<textarea id="inp-rsn" placeholder="e.g. Salary, Groceries, Rent\u2026"></textarea>' +
        '</div>' +

        // Submit
        '<button class="submit-btn ' + S.type + '" id="sbmt" onclick="submitTxn()">' +
        (S.type === 'credit' ? '&#x2B06; Add Credit' : '&#x2B07; Add Debit') +
        '</button>' +

        // Recent section
        '<div class="recent-wrap">' +
        '<div class="recent-hdr"><h3>Transactions</h3><span class="txn-count" id="txn-count">loading…</span></div>' +

        // Search bar
        '<div class="search-row">' +
        '<input type="text" id="srch-inp" placeholder="&#x1F50D; Search by reason, type, date\u2026" value="' + searchVal + '" onkeydown="if(event.key===\'Enter\')doSearch()">' +
        '<button class="search-btn" id="srch-btn" onclick="doSearch()">Search</button>' +
        (S.searchMode ? '<button class="search-clear-btn" onclick="clearSearch()">Clear</button>' : '') +
        '</div>' +

        // Meta / results area
        '<div id="txn-meta"></div>' +
        '<div class="txn-list" id="txn-list"><div class="loading-note"><div class="spin"></div> Fetching transactions…</div></div>' +
        '</div>' +

        '</div>'
      );

      setTimeout(function () {
        var a = document.getElementById('inp-amt');
        if (a) a.focus();
      }, 120);

      // Load summary
      loadSummary();

      // Load transactions (recent or search results)
      if (S.searchMode && S.searchQ) {
        fetchSearch(S.searchQ);
      } else {
        fetchRecent();
      }
    }

    /* ─ Summary ──────────────────────────────── */
    function loadSummary() {
      fetch(S.url + '?action=summary')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var cr = d.credit || 0;
          var db = d.debit || 0;
          var bal = d.balance || 0;

          var cv = document.getElementById('credit-val');
          var dv = document.getElementById('debit-val');
          var bv = document.getElementById('balance-val');

          if (cv) cv.innerHTML = '&#8377;' + fmt(cr);
          if (dv) dv.innerHTML = '&#8377;' + fmt(db);
          if (bv) {
            bv.innerHTML = '&#8377;' + fmt(Math.abs(bal));
            bv.className = 'month-bal ' + (bal > 0 ? 'pos' : bal < 0 ? 'neg' : 'neu');
          }
        })
        .catch(function () {
          var cv = document.getElementById('credit-val');
          var dv = document.getElementById('debit-val');
          var bv = document.getElementById('balance-val');
          if (cv) cv.innerHTML = '&#8377;–';
          if (dv) dv.innerHTML = '&#8377;–';
          if (bv) bv.innerHTML = '&#8377;–';
        });
    }

    /* ─ Fetch recent 5 from Sheets ───────────── */
    function fetchRecent() {
      fetch(S.url + '?action=recent')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var txns = d.transactions || [];
          renderTxnList(txns, false, null);
          var cnt = document.getElementById('txn-count');
          if (cnt) cnt.textContent = 'last 5';
        })
        .catch(function () {
          var list = document.getElementById('txn-list');
          if (list) list.innerHTML = '<div class="empty-note">Could not load transactions. Check Script URL.</div>';
          var cnt = document.getElementById('txn-count');
          if (cnt) cnt.textContent = 'error';
        });
    }

    /* ─ Search ───────────────────────────────── */
    function doSearch() {
      var inp = document.getElementById('srch-inp');
      var q = inp ? inp.value.trim() : '';
      if (!q) { clearSearch(); return; }

      S.searchMode = true;
      S.searchQ = q;

      var btn = document.getElementById('srch-btn');
      var list = document.getElementById('txn-list');
      var meta = document.getElementById('txn-meta');
      var cnt = document.getElementById('txn-count');

      if (btn) { btn.disabled = true; btn.innerHTML = '<div class="spin"></div>'; }
      if (list) list.innerHTML = '<div class="loading-note"><div class="spin"></div> Searching…</div>';
      if (meta) meta.innerHTML = '';

      fetchSearch(q, function () {
        if (btn) { btn.disabled = false; btn.textContent = 'Search'; }
      });
    }

    function fetchSearch(q, cb) {
      fetch(S.url + '?action=search&q=' + encodeURIComponent(q))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var txns = d.transactions || [];
          renderTxnList(txns, true, q);
          var cnt = document.getElementById('txn-count');
          if (cnt) cnt.textContent = txns.length + ' found';
          if (cb) cb();
        })
        .catch(function () {
          var list = document.getElementById('txn-list');
          if (list) list.innerHTML = '<div class="empty-note">Search failed. Check Script URL.</div>';
          if (cb) cb();
        });
    }

    function clearSearch() {
      S.searchMode = false;
      S.searchQ = '';
      showAdd();
    }

    /* ─ Render transaction list ──────────────── */
    function renderTxnList(txns, isSearch, q) {
      var list = document.getElementById('txn-list');
      var meta = document.getElementById('txn-meta');
      if (!list) return;

      if (isSearch && q) {
        if (meta) meta.innerHTML =
          '<div class="search-meta">Results for <strong>"' + esc(q) + '"</strong> &mdash; ' + txns.length + ' transaction' + (txns.length !== 1 ? 's' : '') + '</div>';
      }

      if (!txns.length) {
        list.innerHTML = '<div class="empty-note">' +
          (isSearch ? 'No transactions matched "' + esc(q) + '".' : 'No transactions yet. Add your first one!') +
          '</div>';
        return;
      }

      list.innerHTML = txns.map(function (t, idx) {
        var ic = (String(t.type).toLowerCase() === 'credit') ? '&#x2B06;' : '&#x2B07;';
        var sg = (String(t.type).toLowerCase() === 'credit') ? '+' : '&#x2212;';
        var tc = String(t.type).toLowerCase();
        return '<div class="txn-row" style="animation-delay:' + (idx * 0.04) + 's">' +
          '<div class="txn-dot ' + tc + '">' + ic + '</div>' +
          '<div class="txn-body">' +
          '<div class="txn-name">' + esc(String(t.reason)) + '</div>' +
          '<div class="txn-time">' + formatDate(t.dateStr) + '</div>' +
          '</div>' +
          '<div class="txn-val ' + tc + '">' + sg + '&#8377;' + fmt(t.amount) + '</div>' +
          '</div>';
      }).join('');
    }

    /* ─ Set type ─────────────────────────────── */
    function setType(t) {
      S.type = t;
      showAdd();
    }

    function formatDate(dateStr) {
      try {
        var d = new Date(dateStr);

        return d.toLocaleDateString('en-IN', {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        });

      } catch (e) {
        return dateStr;
      }
    }

    /* ─ Submit ───────────────────────────────── */
    function submitTxn() {
      var av = document.getElementById('inp-amt').value;
      var amount = parseFloat(av);
      var reason = document.getElementById('inp-rsn').value.trim();
      if (!av || isNaN(amount) || amount <= 0) { toast('Enter a valid amount', 'err'); return; }
      if (!reason) { toast('Please add a reason', 'err'); return; }

      var btn = document.getElementById('sbmt');
      btn.disabled = true;
      btn.innerHTML = '<div class="spin"></div> Saving\u2026';

      var now = new Date();
      var entry = {
        id: Date.now(),
        type: S.type,
        amount: amount,
        reason: reason,
        date: now.toISOString(),
        dateStr: now.toLocaleDateString('en-IN'),
        timeStr: now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })
      };

      S.txns.push(entry);
      localStorage.setItem('sp_txns', JSON.stringify(S.txns));

      fetch(S.url, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(entry)
      })
        .then(r => r.json())
        .then(data => {
          console.log(data);
          toast(
            S.type === 'credit'
              ? '⬆ Credit saved!'
              : '⬇ Debit saved!',
            'ok'
          );
        })
        .catch(err => {
          console.error(err);
          toast('Failed to save transaction', 'err');
        }).then(function () {
          toast(S.type === 'credit' ? '&#x2B06; Credit saved!' : '&#x2B07; Debit saved!', 'ok');
        }).catch(function () {
          toast('Saved locally \u2014 check Script URL', 'err');
        }).finally(function () {
          S.searchMode = false;
          S.searchQ = '';
          setTimeout(showAdd, 350);
        });
    }

    /* ════════════════════════════════════════════
       SETTINGS
    ════════════════════════════════════════════ */
    function goSettings() {
      document.getElementById('gear').style.display = 'none';
      var con = !!S.url;
      var safeUrl = esc(S.url);
      var safeCode = esc(GAS);

      setView(
        '<div class="view settings-screen">' +

        '<button class="back-btn" onclick="goBack()">' +
        '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 3L5 8l5 5"/></svg>' +
        'Back' +
        '</button>' +

        '<div class="s-section">' +
        '<span class="s-label">Connection</span>' +
        '<div class="s-card">' +
        '<div class="status-badge ' + (con ? 'on' : 'off') + '">' + (con ? '&#x2713; Connected to Google Sheets' : '&#x2717; Not Connected') + '</div>' +
        (con ? '<p style="margin-top:12px;margin-bottom:0;font-size:12px;word-break:break-all;color:var(--muted)">' + safeUrl + '</p>' : '') +
        '</div>' +
        '</div>' +

        '<div class="s-section">' +
        '<span class="s-label">How to Set Up</span>' +
        '<div class="s-card">' +
        '<ol class="steps">' +
        '<li>Open <strong>Google Sheets</strong> and create a new spreadsheet.</li>' +
        '<li>Click <strong>Extensions &#x2192; Apps Script</strong>.</li>' +
        '<li>Delete existing code and paste the code below.</li>' +
        '<li>Click <strong>Deploy &#x2192; New Deployment &#x2192; Web App</strong>.</li>' +
        '<li>Set <em>Execute as: Me</em> &amp; <em>Who has access: Anyone</em>, then Deploy.</li>' +
        '<li>Authorize, copy the <strong>Web App URL</strong>, paste below &amp; tap Save.</li>' +
        '</ol>' +
        '</div>' +
        '</div>' +

        '<div class="s-section">' +
        '<span class="s-label">Apps Script Code</span>' +
        '<div class="s-card">' +
        '<p>Copy &amp; paste into the Apps Script editor:</p>' +
        '<div class="code-box" id="gc">' + safeCode + '</div>' +
        '<button class="copy-btn" id="cpbtn" onclick="copyGas()">&#x1F4CB; Copy Code</button>' +
        '</div>' +
        '</div>' +

        '<div class="s-section">' +
        '<span class="s-label">Web App URL</span>' +
        '<div class="s-card">' +
        '<p>Paste your deployed Apps Script Web App URL here:</p>' +
        '<div class="url-row">' +
        '<input type="url" id="urlinp" placeholder="https://script.google.com/macros/s/\u2026" value="' + safeUrl + '">' +
        '<button class="save-btn" onclick="saveUrl()">Save</button>' +
        '</div>' +
        (con ? '<button class="remove-btn" onclick="removeUrl()">Remove Connection</button>' : '') +
        '</div>' +
        '</div>' +

        '<div class="s-section">' +
        '<span class="s-label">&#x1F4CA; Reports in Sheets</span>' +
        '<div class="s-card">' +
        '<p>After your first entry, three sheets are created automatically:</p>' +
        '<p>&#x1F4CB; <strong style="color:var(--text)">Transactions</strong> &#x2014; full log with date, type, amount, reason, week number.</p>' +
        '<p>&#x1F4C5; <strong style="color:var(--text)">Monthly_YYYY</strong> &#x2014; credit/debit totals per month + bar chart.</p>' +
        '<p>&#x1F4C6; <strong style="color:var(--text)">Yearly_Summary</strong> &#x2014; year-over-year totals + column chart.</p>' +
        '<p>For <strong style="color:var(--text)">weekly</strong> reports, filter Transactions by the <em style="color:var(--gold)">Week</em> column.</p>' +
        '</div>' +
        '</div>' +

        '<div class="s-section">' +
        '<span class="s-label">Developer</span>' +
        '<div class="s-card" style="text-align:center;">' +
        '<div style="font-family:Syne,sans-serif;font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--credit));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;">Tarun Mhanta</div>' +
        '<p style="margin-bottom:10px;">Designed &amp; Developed with passion for smart finance tracking, automation and modern user experiences.</p>' +
        '<div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">' +
        '<a href="https://github.com/tarunmhanta" target="_blank" style="text-decoration:none;padding:8px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600;">&#x1F4BB; GitHub</a>' +
        '<a href="https://www.linkedin.com/in/tarun-mhanta/" target="_blank" style="text-decoration:none;padding:8px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600;">&#x1F465; LinkedIn</a>' +
        '</div>' +
        '</div>' +
        '</div>' +

        '</div>'
      );
    }

    function goBack() {
      document.getElementById('gear').style.display = 'flex';
      if (S.url) showAdd(); else showWelcome();
    }

    function saveUrl() {
      var v = document.getElementById('urlinp').value.trim();
      if (!v || !v.startsWith('https://')) { toast('Enter a valid HTTPS URL', 'err'); return; }
      S.url = v;
      localStorage.setItem('sp_url', v);
      toast('&#x2713; Connected!', 'ok');
      setTimeout(function () { goBack(); }, 700);
    }

    function removeUrl() {
      S.url = '';
      localStorage.removeItem('sp_url');
      toast('Connection removed', '');
      goSettings();
    }

    function copyGas() {
      var done = function () { flashCopy(); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(GAS).then(done).catch(function () { fallback(GAS, done); });
      } else {
        fallback(GAS, done);
      }
    }

    function fallback(txt, cb) {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); cb(); } catch (e) { toast('Copy manually', 'err'); }
      document.body.removeChild(ta);
    }

    function flashCopy() {
      var b = document.getElementById('cpbtn'); if (!b) return;
      b.textContent = '✓ Copied!'; b.classList.add('copied');
      setTimeout(function () { b.innerHTML = '&#x1F4CB; Copy Code'; b.classList.remove('copied'); }, 2000);
    }

    /* ════════════════════════════════════════════
       HELPERS
    ════════════════════════════════════════════ */
    function setView(html) { document.getElementById('view').innerHTML = html; }

    function fmt(n) {
      return parseFloat(n).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
    }

    var _tt;
    function toast(msg, cls) {
      var el = document.getElementById('toast');
      el.innerHTML = msg; el.className = 'show' + (cls ? ' ' + cls : '');
      clearTimeout(_tt);
      _tt = setTimeout(function () { el.className = ''; }, 2700);
    }

    /* ════════════════════════════════════════════
       START
    ════════════════════════════════════════════ */
    boot();
  </script>
</body>

</html>
